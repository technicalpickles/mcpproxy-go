# Run images built by docker-bake.hcl. Provides slim and full variants
# simultaneously with distinct ports.
services:
  # Slim (distroless) runtime
  slim:
    image: "${IMAGE:-ghcr.io/smart-mcp-proxy/mcpproxy}:${VERSION:-latest}-slim"
    ports:
      - "${PORT_SLIM:-8081}:8080"
    volumes:
      - mcpproxy-app-slim:/app
    restart: unless-stopped

  # Full (Debian bookworm-slim with runtimes, docker CLI, node, python)
  full:
    image: "${IMAGE:-ghcr.io/smart-mcp-proxy/mcpproxy}:${VERSION:-latest}"
    ports:
      - "${PORT_FULL:-8080}:8080"
    volumes:
      - mcpproxy-app-full:/app
      # Bind the engine host's Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # Helper check script for diagnostics
      - ./scripts/docker-socket-check.sh:/usr/local/bin/docker-socket-check:ro
    environment:
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
    group_add:
      - "${DOCKER_GID:-0}"
    restart: unless-stopped

# Notes:
# - Build images with Bake first (locally loaded):
#     make build-slim        # tags: ${IMAGE}:${VERSION}-slim and :latest-slim
#     make build-full        # tags: ${IMAGE}:${VERSION} and :latest
#
# - Bring up specific variant(s):
#     docker compose up -d mcpproxy-slim
#     docker compose up -d mcpproxy-full
#     docker compose up -d               # both services
#
# - Override defaults at runtime:
#     IMAGE=ghcr.io/you/mcpproxy VERSION=dev PORT_FULL=18080 PORT_SLIM=18081 \
#       docker compose up -d mcpproxy-full

volumes:
  mcpproxy-app-slim: {}
  mcpproxy-app-full: {}
